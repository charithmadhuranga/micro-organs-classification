[project]
name = "microclassify"
version = "1.0.0"
description = "Professional Microorganism Image Classification System with real-time video streaming"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python>=4.8.0",
    "kivy>=2.2.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["micro_classifier"]

[project.scripts]
microclassify = "micro_classifier.__main__:main"
